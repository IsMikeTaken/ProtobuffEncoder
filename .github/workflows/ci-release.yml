name: CI — Release

on:
  push:
    branches: [master]
    paths-ignore:
      - 'writerside/**'
      - 'docs/**'
      - '*.md'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-test-pack:
    name: build / test / pack
    uses: ./.github/workflows/_build-test-pack.yml
    with:
      version_suffix: ''
      push_to_github: true
      push_to_nuget: true
      retention_days: 30
    secrets:
      NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}
      NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}

  # ── Create GitHub Release with tag ──────────────────────────────────────
  release:
    name: release / tag
    needs: build-test-pack
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="${{ needs.build-test-pack.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

      - name: Download NuGet packages
        if: steps.tag_check.outputs.exists == 'false'
        uses: actions/download-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs

      - name: Create tag and GitHub Release
        if: steps.tag_check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.tag_check.outputs.tag }}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            ./nupkgs/*.nupkg
