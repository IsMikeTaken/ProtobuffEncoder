name: CI — Development

on:
  push:
    branches: [develop, development]
    paths-ignore:
      - 'writerside/**'
      - 'docs/**'
      - '*.md'

concurrency:
  group: dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build-test-pack:
    name: build / test / pack
    uses: ./.github/workflows/_build-test-pack.yml
    with:
      version_suffix: dev.${{ github.run_number }}
      push_to_github: true
      push_to_nuget: false
      retention_days: 7
    secrets:
      NUGET_GITHUB_TOKEN: ${{ secrets.NUGET_GITHUB_TOKEN }}
